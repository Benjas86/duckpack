name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build and Release (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc 2.35 - works on Debian 12 Bookworm, Ubuntu 22.04+, Debian 13+, Fedora 36+, RHEL 9+)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: duckpack
            asset_name: duckpack-linux-amd64

          # Linux aarch64 (ARM64 dev containers, Docker on Apple Silicon, AWS Graviton - native ARM runner)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: duckpack
            asset_name: duckpack-linux-arm64
            rustflags: "-C link-arg=-Wl,--undefined=duckdb_register_static_extensions"

          # macOS (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: duckpack
            asset_name: duckpack-macos-amd64
            deployment_target: "10.15"

          # macOS (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: duckpack
            asset_name: duckpack-macos-arm64
            deployment_target: "10.15"

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: duckpack.exe
            asset_name: duckpack-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target || '' }}

      - name: Rename Artifact (Linux/macOS)
        run: mv target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
        if: runner.os != 'Windows'
        
      - name: Rename Artifact (Windows)
        run: mv target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
        if: runner.os == 'Windows'
        shell: bash

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}

  wheels:
    name: Build Python Wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            deployment_target: "10.15"
          - os: macos-latest
            target: x86_64-apple-darwin
            deployment_target: "10.15"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target || '' }}

      - name: Upload Release Wheels
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Build Python Source Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload Release sdist
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Upload sdist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*

  pypi-publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/duckpack
    permissions:
      id-token: write
    steps:
      - name: Download all Python distribution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist/
          merge-multiple: true

      - name: Check for PYPI_API_TOKEN secret
        id: token-check
        run: |
          if [ -n "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to PyPI (via API Token)
        if: steps.token-check.outputs.has_token == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI (via Trusted Publishing OIDC)
        if: steps.token-check.outputs.has_token != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
